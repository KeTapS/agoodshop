<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgoodShop - Carrito</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>AgoodShop</h1>
  </header>

  <main class="contenedor">
    <section class="productos">
      <p id="estado" class="estado">Cargando productos...</p>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Pr. Unidad</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="productos"></tbody>
      </table>
    </section>

    <aside class="resumen">
      <h2>Total</h2>
      <ul id="resumen-lista"></ul>
      <div class="resumen-total">
        <span>TOTAL</span>
        <span id="resumen-total">0.00€</span>
      </div>
    </aside>
  </main>

  <script src="js/Carrito.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
